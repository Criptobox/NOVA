<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA — Sin conexión</title>
<meta name="theme-color" content="#030711">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;color:#eef7ff;font-family:Inter,system-ui,sans-serif;background:
radial-gradient(circle at 50% 30%,rgba(42,105,255,.16),transparent 40%),
linear-gradient(135deg,#02050c,#06111f 48%,#030812);text-align:center;padding:24px}
.orb{width:120px;height:120px;border-radius:50%;margin:0 auto 26px;background:radial-gradient(circle at 34% 27%,#e9ffff 0 1%,#63eaff 5%,#2778ff 21%,#182c91 46%,#24105c 68%,#050817 75%);box-shadow:0 0 30px rgba(50,185,255,.6),0 0 80px rgba(75,72,255,.35),inset -14px -18px 40px #020512;animation:b 3.8s ease-in-out infinite}
@keyframes b{0%,100%{transform:scale(.96)}50%{transform:scale(1.04)}}
h1{font-size:22px;margin:0 0 8px}p{color:#8296b3;font-size:13px;line-height:1.7;max-width:380px;margin:0 auto 26px}
button{border:1px solid rgba(77,157,255,.4);background:linear-gradient(90deg,rgba(40,113,220,.4),rgba(112,65,220,.35));color:#fff;padding:12px 26px;border-radius:12px;font-size:14px;cursor:pointer}
small{display:block;margin-top:22px;color:#5d7290;font-size:11px}
</style>
</head>
<body>
<div>
  <div class="orb"></div>
  <h1>NOVA está en modo reposo</h1>
  <p>No hay conexión a internet en este momento.<br>
  Tus datos siguen a salvo en este dispositivo y la app volverá a funcionar con normalidad en cuanto vuelva la red.</p>
  <button onclick="location.reload()">Reintentar conexión</button>
  <small>NOVA PWA · v001</small>
</div>
</body>
</html>
